<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
  <!-- Platzhalter für das Hero-Bild (16:9). Wird später durch das echte Foto ersetzt. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset=".55" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#2f4676"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".38" r=".55">
      <stop offset="0" stop-color="#3a5488" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3a5488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="diag" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="36" stroke="#ffffff" stroke-opacity=".045" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="2400" height="1350" fill="url(#bg)"/>
  <rect width="2400" height="1350" fill="url(#glow)"/>
  <rect width="2400" height="1350" fill="url(#diag)"/>
  <g transform="translate(1200 250)" fill="none" stroke="#ffffff" stroke-opacity=".32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-90" y="-70" width="180" height="140" rx="16"/>
    <circle cx="-38" cy="-24" r="16"/>
    <path d="M-90 52 -28 -4 18 40 46 14 90 54"/>
  </g>
  <text x="1200" y="390" text-anchor="middle" fill="#ffffff" fill-opacity=".42" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="700" font-size="44" letter-spacing="10">PLATZHALTER HERO-BILD</text>
</svg>
